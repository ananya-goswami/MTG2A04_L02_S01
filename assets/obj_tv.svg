<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 172" width="260" height="172" role="img" aria-label="टीवी">
  <!-- The TV (P3, SME deck page 11): a flat TV on a small stand, a cartoon on its screen (sun, hills, a tree). The
       frame spans the full width (x 2..258), so blocks laid on its top edge run from one end to the other. -->
  <defs>
    <linearGradient id="tvFrame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A3F4D"/><stop offset="1" stop-color="#232733"/></linearGradient>
    <linearGradient id="tvSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7CCBFA"/><stop offset="1" stop-color="#CDEEFF"/></linearGradient>
    <clipPath id="tvScr"><rect x="12" y="12" width="236" height="126" rx="4"/></clipPath>
  </defs>
  <!-- the stand -->
  <g stroke="#14161C" stroke-width="2.4" stroke-linejoin="round">
    <path d="M116 150H144L148 162H112Z" fill="#3A3F4D"/>
    <rect x="84" y="160" width="92" height="10" rx="5" fill="#2B2F3A"/>
  </g>
  <rect x="2" y="2" width="256" height="150" rx="11" fill="url(#tvFrame)" stroke="#14161C" stroke-width="2.6"/>
  <rect x="12" y="12" width="236" height="126" rx="4" fill="url(#tvSky)"/>
  <g clip-path="url(#tvScr)">
    <circle cx="196" cy="44" r="16" fill="#FFD84D"/>
    <circle cx="196" cy="44" r="23" fill="#FFE98C" opacity=".35"/>
    <path d="M40 46Q40 36 50 36Q54 28 64 30Q72 25 79 33Q89 33 89 43Q89 50 81 50H46Q40 50 40 46Z" fill="#FFFFFF"/>
    <path d="M12 112Q60 76 110 100T200 92T248 104V138H12Z" fill="#7CCB6E"/>
    <path d="M12 124Q70 104 130 120T248 116V138H12Z" fill="#5BB352"/>
    <path d="M70 104V86" stroke="#7A4A22" stroke-width="5" stroke-linecap="round"/>
    <circle cx="70" cy="78" r="14" fill="#3E9E48"/>
    <path d="M150 12L110 138H132L172 12Z" fill="#FFFFFF" opacity=".16"/>
  </g>
  <rect x="12" y="12" width="236" height="126" rx="4" fill="none" stroke="#14161C" stroke-width="2"/>
  <path d="M8 6.5H252" stroke="#5E6577" stroke-width="2" stroke-linecap="round" opacity=".9" fill="none"/>
  <circle cx="240" cy="145" r="2.6" fill="#3DDC84"/>
