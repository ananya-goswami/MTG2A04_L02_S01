<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 132" width="300" height="132" role="img" aria-label="ब्लैकबोर्ड">
  <!-- The blackboard (P2, SME deck page 10, and the classroom game): a green board in a wooden frame with a chalk
       tray, a little chalk on it (1 2 3, a star, a sun). The frame spans the full width (x 2..298), so blocks laid on
       its top edge run from one end to the other. -->
  <defs>
    <linearGradient id="bbWood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C98543"/><stop offset="1" stop-color="#9C5A26"/></linearGradient>
    <linearGradient id="bbBoard" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F7F5A"/><stop offset="1" stop-color="#24523B"/></linearGradient>
    <radialGradient id="bbSmudge" cx=".32" cy=".38" r=".62"><stop offset="0" stop-color="#fff" stop-opacity=".12"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  </defs>
  <g stroke="#5A3314" stroke-width="2.6" stroke-linejoin="round">
    <rect x="2" y="2" width="296" height="114" rx="8" fill="url(#bbWood)"/>
    <rect x="14" y="13" width="272" height="92" rx="3" fill="url(#bbBoard)" stroke="#3E2410"/>
  </g>
  <rect x="15.5" y="14.5" width="269" height="89" rx="2" fill="url(#bbSmudge)"/>
  <path d="M6 7H294" stroke="#E0A564" stroke-width="2" stroke-linecap="round" opacity=".8" fill="none"/>
  <!-- chalk -->
  <g fill="none" stroke="#F4F7F2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" opacity=".92">
    <path d="M42 40L49 34V66"/>
    <path d="M63 39Q69 32 76 35Q83 40 76 49L63 66H83"/>
    <path d="M95 37Q103 31 109 37Q112 44 103 48Q113 51 111 59Q105 68 95 63"/>
    <path d="M152 33L156.5 44.5L168.5 45L159 52.5L162.5 64L152 57.5L141.5 64L145 52.5L135.5 45L147.5 44.5Z"/>
    <path d="M40 84Q60 77 80 84T120 84T160 84"/>
  </g>
  <g fill="none" stroke="#FFE27A" stroke-width="3.2" stroke-linecap="round" opacity=".9">
    <circle cx="230" cy="50" r="12"/>
    <path d="M230 30V26M230 74V70M210 50H206M254 50H250M216 36L213 33M244 64L247 67M244 36L247 33M216 64L213 67"/>
  </g>
  <!-- the chalk tray, a stick of chalk and a duster on it -->
  <path d="M22 112H278Q282 112 282 116V124Q282 128 278 128H22Q18 128 18 124V116Q18 112 22 112Z" fill="url(#bbWood)" stroke="#5A3314" stroke-width="2.6" stroke-linejoin="round"/>
  <rect x="190" y="106.5" width="26" height="6.5" rx="3.2" fill="#FFFFFF" stroke="#BFC7BC" stroke-width="1.2"/>
  <g stroke="#5A3314" stroke-width="2" stroke-linejoin="round">
    <rect x="228" y="100" width="42" height="13" rx="3" fill="#E4B472"/>
    <path d="M228 108H270V110Q270 113 267 113H231Q228 113 228 110Z" fill="#666B77"/>
  </g>
</svg>
