<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 116" width="420" height="116" role="img" aria-label="बेंच">
  <!-- The classroom bench (P2 "हर चीज़ को उसके सही माप से मिलाइए", SME deck page 10, and the classroom game): a long
       plank seat seen a little from above, its front edge, an apron, splayed legs at each end joined by a stretcher.
       The seat spans the full width (x 2..418), so blocks laid on it run from one end to the other. Legs end at y 114. -->
  <defs>
    <linearGradient id="bnTop" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#DDA05E"/><stop offset="1" stop-color="#C98543"/></linearGradient>
    <linearGradient id="bnEdge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8723A"/><stop offset="1" stop-color="#9C5A26"/></linearGradient>
    <linearGradient id="bnLeg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C07A3D"/><stop offset=".7" stop-color="#B06A30"/><stop offset="1" stop-color="#8E4F1F"/></linearGradient>
    <linearGradient id="bnLegR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#C07A3D"/><stop offset=".7" stop-color="#B06A30"/><stop offset="1" stop-color="#8E4F1F"/></linearGradient>
    <linearGradient id="bnBack" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7A4219"/><stop offset="1" stop-color="#8E5122"/></linearGradient>
  </defs>
  <g stroke="#5A3314" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round">
    <!-- back legs: set in, ending higher -->
    <path d="M64 30H82L88 101Q88.3 104 85 104H73Q70 104 69.8 101Z" fill="url(#bnBack)"/>
    <path d="M338 30H356L350.2 101Q350 104 347 104H335Q331.7 104 332 101Z" fill="url(#bnBack)"/>
    <!-- the stretcher between the two ends -->
    <path d="M34 72H386Q389 72 389 75V80Q389 83 386 83H34Q31 83 31 80V75Q31 72 34 72Z" fill="url(#bnEdge)"/>
    <!-- apron under the seat -->
    <path d="M40 34H380V46Q380 49 377 49H43Q40 49 40 46Z" fill="#9E5B28"/>
    <!-- front legs, splayed -->
    <path d="M28 34H54L44 110Q43.5 114 39.5 114H21Q16.5 114 17.2 110Z" fill="url(#bnLeg)"/>
    <path d="M366 34H392L402.8 110Q403.5 114 399 114H380.5Q376.5 114 376 110Z" fill="url(#bnLegR)"/>
    <!-- the seat: its top face and front edge -->
    <path d="M18 3H402Q408 3 411 7.5L417 17Q419 21 414 21H6Q1 21 3 17L9 7.5Q12 3 18 3Z" fill="url(#bnTop)"/>
    <path d="M5 21H415Q418 21 418 24V32Q418 37 413 37H7Q2 37 2 32V24Q2 21 5 21Z" fill="url(#bnEdge)"/>
  </g>
  <!-- wood grain + light -->
  <g fill="none" stroke-linecap="round">
    <path d="M40 9C120 7 200 12 270 9S370 8 396 10" stroke="#B86F33" stroke-width="1.8" opacity=".55"/>
    <path d="M24 15C110 13 190 18 290 14S380 14 404 16" stroke="#B86F33" stroke-width="1.6" opacity=".45"/>
    <path d="M10 20H410" stroke="#EDB27A" stroke-width="2" opacity=".8"/>
    <path d="M22 5.5H398" stroke="#F0BD88" stroke-width="1.8" opacity=".7"/>
    <path d="M30 29C130 27 250 31 390 28" stroke="#8A4C1E" stroke-width="1.4" opacity=".45"/>
    <path d="M60 76C160 75 260 78 360 76" stroke="#D08C4E" stroke-width="1.4" opacity=".5"/>
    <path d="M34 40L26 106" stroke="#D08C4E" stroke-width="2.6" opacity=".55"/>
    <path d="M386 40L394 106" stroke="#D08C4E" stroke-width="2.6" opacity=".55"/>
  </g>
</svg>
