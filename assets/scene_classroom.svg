  </g>
  <g stroke="#1F4E79" stroke-width="2.2"><rect x="89" y="50" width="10" height="126" fill="url(#crBlue)"/><rect x="34" y="108" width="120" height="9" fill="url(#crBlue)"/></g>
  <path d="M20 184H168Q170 184 170 186V193Q170 198 165 198H23Q18 198 18 193V186Q18 184 20 184Z" fill="url(#crSill)" stroke="#5A3314" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- door -->
  <rect x="716" y="92" width="98" height="172" rx="4" fill="#8E5122" stroke="#5A3314" stroke-width="2.6"/>
  <rect x="724" y="100" width="82" height="164" rx="3" fill="url(#crDoor)" stroke="#5A3314" stroke-width="2.2"/>
  <rect x="736" y="112" width="58" height="40" rx="3" fill="url(#crSky)" stroke="#5A3314" stroke-width="2"/>
  <rect x="736" y="166" width="58" height="84" rx="4" fill="none" stroke="#8E5122" stroke-width="2.4"/>
  <circle cx="796" cy="190" r="5" fill="#FFC21A" stroke="#8E5122" stroke-width="1.6"/>
  <!-- floor -->
  <rect y="264" width="1033" height="76" fill="url(#crFloor)"/>
  <path d="M0 264H1033" stroke="#B98F5F" stroke-width="6"/>
  <g stroke="#8A6A45" stroke-width="1.4" opacity=".28" fill="none">
    <path d="M0 290H1033M0 318H1033"/>
    <path d="M36 267L-108 340M116 267L-4 340M196 267L100 340M276 267L204 340M356 267L308 340M436 267L412 340M516 267V340M596 267L620 340M676 267L724 340M756 267L828 340M836 267L932 340M916 267L1036 340M996 267L1140 340"/>
