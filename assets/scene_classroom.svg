<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1033 340" width="1033" height="340" role="img" aria-label="कक्षा">
  <!-- The classroom of the classroom game (P4, SME deck pages 12-13): a front view - the back wall with bunting, a
       wainscot band and a clock, the window on the left, the door on the right, the floor with its tiles. The four
       empty spaces (the blackboard's on the wall, the chair's beside the window, the almirah's in the right corner,
       the bench's on the floor between two markers) are drawn over it by app.js [CLASSROOM_FIT], in these same px. -->
  <defs>
    <linearGradient id="crWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FCE9CF"/></linearGradient>
    <linearGradient id="crFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D6BA"/><stop offset="1" stop-color="#DCC5A4"/></linearGradient>
    <linearGradient id="crSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#86CFF8"/><stop offset="1" stop-color="#D8F2FF"/></linearGradient>
    <linearGradient id="crBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#57A9E6"/><stop offset="1" stop-color="#2E7CC0"/></linearGradient>
    <linearGradient id="crDoor" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#C98543"/><stop offset="1" stop-color="#A9632C"/></linearGradient>
    <linearGradient id="crSill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D99552"/><stop offset="1" stop-color="#A9632C"/></linearGradient>
    <clipPath id="crGlass"><rect x="34" y="50" width="120" height="126" rx="2"/></clipPath>
  </defs>
  <!-- wall -->
  <rect width="1033" height="264" fill="url(#crWall)"/>
  <rect y="200" width="1033" height="64" fill="#F7DDBB"/>
  <path d="M0 200H1033" stroke="#E4C193" stroke-width="3"/>
  <!-- bunting -->
  <path d="M-4 8Q258 30 516 10T1037 10" fill="none" stroke="#B08B5E" stroke-width="2"/>
  <g stroke="#FFFFFF" stroke-width="1.5" stroke-linejoin="round">
    <path d="M24 12.7L50 15.6L35 36Z" fill="#F93544"/>
    <path d="M80 18L106 20.4L91 41Z" fill="#FFC21A"/>
    <path d="M136 21.7L162 23.4L147 44Z" fill="#2F82DE"/>
    <path d="M192 23.9L218 24.8L203 46Z" fill="#1DB954"/>
    <path d="M248 24.6L274 24.7L259 46Z" fill="#8B2FC9"/>
    <path d="M304 23.8L330 23L315 45Z" fill="#F93544"/>
    <path d="M360 21.6L386 20.2L371 42Z" fill="#FFC21A"/>
    <path d="M416 18.2L442 16.4L427 38Z" fill="#2F82DE"/>
    <path d="M472 14.2L498 12.3L483 34Z" fill="#1DB954"/>
    <path d="M528 10.3L554 9.3L539 31Z" fill="#8B2FC9"/>
    <path d="M584 8.2L610 8L595 29Z" fill="#F93544"/>
    <path d="M640 8.3L666 9.1L651 30Z" fill="#FFC21A"/>
    <path d="M696 10.1L722 11.3L707 32Z" fill="#2F82DE"/>
    <path d="M752 12.6L778 13.7L763 35Z" fill="#1DB954"/>
    <path d="M808 14.4L834 14.9L819 36Z" fill="#8B2FC9"/>
    <path d="M864 14.9L890 14.4L875 36Z" fill="#F93544"/>
    <path d="M920 13.7L946 12.6L931 34Z" fill="#FFC21A"/>
    <path d="M976 11.3L1002 10.1L987 32Z" fill="#2F82DE"/>
  </g>
  <!-- clock -->
  <g transform="translate(660 62)">
    <circle r="23" fill="#FFFFFF" stroke="#2F82DE" stroke-width="5"/>
    <g stroke="#9AA6B8" stroke-width="2.2" stroke-linecap="round"><path d="M0-16V-13M0 13V16M-16 0H-13M13 0H16"/></g>
    <path d="M0 0V-11M0 0L8 5" stroke="#012F76" stroke-width="3" stroke-linecap="round"/>
    <circle r="2.6" fill="#F93544"/>
  </g>
  <!-- window -->
  <rect x="24" y="40" width="140" height="146" rx="6" fill="url(#crBlue)" stroke="#1F4E79" stroke-width="2.6"/>
  <rect x="34" y="50" width="120" height="126" rx="2" fill="url(#crSky)" stroke="#1F4E79" stroke-width="2.2"/>
  <g clip-path="url(#crGlass)">
    <circle cx="128" cy="74" r="12" fill="#FFD84D"/>
    <path d="M46 92Q46 84 55 84Q58 76 67 78Q74 73 80 80Q89 80 89 89Q89 95 82 95H51Q46 95 46 92Z" fill="#FFFFFF"/>
