<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1033 340" width="1033" height="340" role="img" aria-label="कक्षा">
  <!-- The classroom of the classroom game (P4, SME deck pages 12-13): a front view - the back wall with a wainscot
       band, the floor with its tiles. Its bunting, clock, window and door are the supplied HD pictures (review
       2026-10-01: "use these hd images and replace the assets in last game screen"), laid on it by app.js
       [CLASSROOM_FIT] from data.room; the four empty spaces (the blackboard's on the wall, the chair's beside the
       window, the almirah's in the right corner, the bench's on the floor between two markers) are drawn over it
       there too, in these same px. -->
  <defs>
    <linearGradient id="crWall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#FCE9CF"/></linearGradient>
    <linearGradient id="crFloor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#E9D6BA"/><stop offset="1" stop-color="#DCC5A4"/></linearGradient>
  </defs>
  <!-- wall -->
  <rect width="1033" height="264" fill="url(#crWall)"/>
  <rect y="200" width="1033" height="64" fill="#F7DDBB"/>
  <path d="M0 200H1033" stroke="#E4C193" stroke-width="3"/>
  <!-- floor -->
  <rect y="264" width="1033" height="76" fill="url(#crFloor)"/>
  <path d="M0 264H1033" stroke="#B98F5F" stroke-width="6"/>
  <g stroke="#8A6A45" stroke-width="1.4" opacity=".28" fill="none">
    <path d="M0 290H1033M0 318H1033"/>
    <path d="M36 267L-108 340M116 267L-4 340M196 267L100 340M276 267L204 340M356 267L308 340M436 267L412 340M516 267V340M596 267L620 340M676 267L724 340M756 267L828 340M836 267L932 340M916 267L1036 340M996 267L1140 340"/>
  </g>
</svg>
