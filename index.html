.dev-nav-sel{border:none;border-radius:8px;padding:4px 6px;font-size:12px;max-width:150px;background:#eef2f8;color:#12203c;cursor:pointer;}
.dev-nav-lbl{color:#fff;font-size:13px;font-weight:700;min-width:78px;text-align:center;letter-spacing:.02em;}
/* ================= END IN-LESSON LAYOUT PARITY =========================== */

/* --- the last of my QA override to undo: HI01's .tut-prompt declares no
       `white-space` at all, so copying that rule could not overwrite the
       `nowrap` I had added and it survived. Reset explicitly. A wrapped prompt
       is the whole point here - this card's prompts are sentences. --- */
.tut-prompt{white-space:normal;}

/* --- HEADER PROMPT SITS 40px TOO FAR RIGHT (HI01 :root line 37).
       The band itself already matched HI01 exactly (1538x106 @212,58); what
       differed was its LEFT padding - HI01 runs --band-pad-l:110px against
       MTG's 150px, so every prompt in the game started 40px further right and
       read as off-centre under the overlapping mascot avatar. Right padding is
       150px in both and is unchanged, so the text just gains 40px of run.
       One token, so it applies to every prompt band throughout the game. --- */
:root{ --band-pad-l:110px; }

/* ==========================================================================
   HINT BUTTON REMOVED THROUGHOUT (requested)
   Same mechanism HI01 uses at its line 1367, and for the same reason it gives:
   removed with display:none rather than by deleting the node and its call
   sites, because $("hintBtn") is dereferenced UNGUARDED at every one of them
   (21 in app.js) - dropping the element would throw on the first wrong answer
   in every mechanic. This way the bulb cannot render, cannot be tapped, and is
   out of the accessibility tree, while the now-inert classList/disabled calls
   stay harmless. Covers the whole game: one rule, no per-slide exceptions.
   Knock-on, stated rather than hidden: with no bulb to tap, the hint_used xAPI
   verb can no longer fire, and checklist items 05/12 (hint bulb behaviour) are
   moot by removal. The scaffold ladder still runs re-listen -> reveal; only the
   manual bulb is gone.
   ========================================================================== */
.hint-btn{display:none !important;}

/* --- DECK ART: the measured object, shown above its block row.
       Capped by height so a tall cut-out (अलमारी, दरवाज़ा) and a wide one
       (पलंग, टेबल) both sit in the same band without pushing the blocks or
       the options off the card. --- */
.measure-obj{flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  width:100%;margin:0 0 10px;pointer-events:none;}
.measure-obj-img{max-height:190px;max-width:62%;width:auto;height:auto;object-fit:contain;
  filter:drop-shadow(0 6px 10px rgba(11,61,140,.16));}
.measure-obj-emoji{font-size:120px;line-height:1;}
.stage.tut .measure-obj-img{max-height:150px;}

/* --- DECK ART FIT. Adding the object image to slides that were already full
       overflowed both containers (measured at 1919x950: tutorial 433px of
       content into 318px, question 550 into 494), so the art rode up over the
       prompt and the block set sat on the option cards. The art is capped and
       made shrinkable, and the block cells go compact on those slides only -
       every rule here is scoped by `.measure-obj ~`, so slides without deck art
       keep their original 190px cells. --- */
.measure-obj{flex:0 1 auto;min-height:0;}
.measure-obj-img{max-height:120px;}
.stage.tut .measure-obj-img{max-height:96px;}

.measure-obj ~ .q-row .count-set{padding:18px 24px 12px;gap:12px;}

/* --- LANDING HERO: the pencil image; its cubes and end lines are built by app.js [landing measure]. --- */
#sgHero{gap:0;align-items:flex-end;}

/* ===================================================================== */
/* MEASUREMENT ART KIT (assets/mk_*)                              */
/* The skill is "lay identical units in ONE ROW with NO GAPS, then count  */
/* them". So on measuring slides the block row loses its per-tile chrome  */
/* and the units sit FLUSH (.mk-rail) — the tile box and its 12–32px      */
/* gutter were drawing the exact gap the lesson forbids.                  */
/* Everything is scoped to .stage.mk-on so it outranks the existing       */
/* `.measure-obj ~ .demo-stage .count-item` sizing (3 classes deep).      */
/* ===================================================================== */

/* ---- the flush rail ---------------------------------------------------- */
.stage.mk-on .mk-rail{gap:0 !important;flex-wrap:nowrap;align-items:flex-end;}
.stage.mk-on .mk-rail .count-item,
.stage.mk-on .mk-rail .ms-item{background:transparent;border:none;box-shadow:none;border-radius:0;
  width:auto;height:auto;min-width:0;padding:0;line-height:0;flex:0 0 auto;}
.stage.mk-on .mk-rail .count-item:hover{transform:none;box-shadow:none;}
.stage.mk-on .mk-rail .count-item.counted{background:transparent;border:none;}
/* the cut leaves ~4–9% clear either side of the cube; pull it back so faces meet */
.stage.mk-on .mk-rail .count-item .count-badge{top:-10px;right:0;min-width:30px;height:30px;
  font-size:19px;padding:0 4px;border:3px solid #fff;}

/* MAKE_SET frame: one unbroken row, left-aligned, so a growing row reads like a
   ruler being built rather than a set that re-centres on every tap.
   104px would overflow at the 9-unit cap (9 units + ghost ≈ 1120px > 1016px box). */

/* COUNT_HOW_MANY stimulus row */
.stage.mk-on .count-set.mk-rail{padding:16px 22px;}

/* ---- ghost slot: where the NEXT unit goes (hard against the last one) ---- */

/* ---- the glow sprite, flashed over a unit the instant it is laid/counted ---- */

/* ---- START / END markers bracketing the measured object ---- */
.measure-obj.mk-measured{position:relative;gap:8px;}
.mk-marker{flex:0 0 auto;width:auto;height:72px;object-fit:contain;align-self:center;
  animation:mkMarkerIn .45s cubic-bezier(.34,1.5,.6,1) both;}
.mk-marker-e{animation-delay:.14s;}
.stage.tut .mk-marker{height:58px;}
@keyframes mkMarkerIn{from{opacity:0;transform:translateY(-14px) scale(.8);}to{opacity:1;transform:none;}}

/* ---- floating overlays -------------------------------------------------- */
/* Both sit ABSOLUTE inside .slide-stage. The slide's own column is flex:1 /
   min-height:0 top to bottom, so anything added to it steals height from the
   scene art above — which is what shoved the table up into the prompt. */
.mk-result,.mk-errflash{position:absolute;left:50%;transform:translateX(-50%);
  z-index:40;pointer-events:none;}

/* result plate: "<n> ब्लॉक्स" on the kit badge, with the sparkle burst behind */
.mk-result{display:flex;align-items:center;justify-content:center;
  opacity:0;transform:translateX(-50%) translateY(10px) scale(.9);
  transition:opacity .34s ease,transform .34s cubic-bezier(.34,1.5,.6,1);}
.mk-result.in{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
/* sits in the blank plate's safe inner box (measured off the cut: 17%/11%/22%/18%) */

/* the two wrong-way figures: a GAP left between units, or units OVERLAPPED */
.mk-errflash{display:block;width:auto;height:104px;object-fit:contain;
  opacity:0;transform:translateX(-50%) translateY(-6px) scale(.92);
  filter:drop-shadow(0 6px 14px rgba(0,47,118,.22));
  transition:opacity .3s ease,transform .3s cubic-bezier(.34,1.5,.6,1);}
.mk-errflash.in{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}

/* ---- full-body Swiftie poses in the feedback card (taller than the old heads) ---- */

@media (prefers-reduced-motion: reduce){
  .mk-marker{animation:none;}
}

/* --- [landing card bg] room scene inside the white card frame.
       start_card.webp stays as the frame (9px white border, ~46px outer radius);
       its translucent-white fill is covered by the room image, inset 9px with the
       matching 37px inner radius. z-index:-1 + isolation keeps it above the frame
       but under the title, blocks, CTA, mascot and VO chip. --- */
.sg-card{isolation:isolate;}
.sg-card::before{content:"";position:absolute;inset:9px;border-radius:37px;z-index:-1;pointer-events:none;
  background:url("assets/background_1st_screen_nolamp.webp") center/100% 100% no-repeat;}   /* 100% 100%, not cover: the 16:9 art in a 2.5:1 box - cover cropped the posters/lamp; this shows the whole scene edge to edge */

/* --- [landing pencil] centre hero on the first screen (replaces the block row).
       pencil.webp is ~6.8:1, so size by WIDTH - the generic 250px height cap would
       blow it past the card. 480px wide = ~70px tall, centred under the title
       (was 600px - read too big next to the title, CTA and Swifty). --- */
.sg-art img[src*="assets/pencil"]{width:480px;max-width:100%;height:auto;max-height:none;
  filter:drop-shadow(0 8px 12px rgba(0,47,118,.18));}

/* --- [landing fx] ambient life for the room art inside the card.
       .sg-fx sits exactly over the room image (inset 9 / radius 37, same as
       .sg-card::before) at z-index:-1 - after ::before in DOM order, so it paints
       over the art but under the title, pencil, CTA, Swifty and VO chip.
       Coordinates below are fx-local (card px - 9). Only transform/opacity
       animate (GPU-cheap on low-end tablets); no filter:blur - the softness is
       baked into the gradients. --- */
.sg-fx{position:absolute;inset:9px;border-radius:37px;overflow:hidden;z-index:-1;pointer-events:none;}

/* soft lens flare, NO sun (review 2026-09-28: "delete the sunbeam - a sun flare without the sun").
   Modelled on the reference: out-of-focus flare discs, not a light source -
   - a BIG hazy disc, warm white, brightest a little off-centre, fading to a faint warm-red rim
     (the defocused edge of a lens ghost picks up a colour fringe);
   - a SMALLER violet disc overlapping the big one's upper-left edge (a second ghost, different
     coating colour);
   - a soft haze lobe inside the big disc and one small, soft glint - a reflection, not a sun:
     no white-hot core, no rays, no rainbow ring.
   All circles use closest-side so the stops are measured from their own edge (no clipping).

.sg-sun{position:absolute;left:170px;top:70px;width:0;height:0;pointer-events:none;}
